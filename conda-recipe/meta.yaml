package:
  name: q2-demux
  version: {{ PLUGIN_VERSION }}
source:
  path: ..
build:
  script: make install
requirements:
  build:
  - nodejs
  - setuptools
  - versioningit
  host:
  - python {{ python }}
  - setuptools
  - versioningit
  - wheel
  run:
  - python {{ python }}
  - pandas {{ pandas }}
  - numpy
  - scikit-bio {{ scikit_bio }}
  - seaborn >=0.8.1
  - pyyaml
  - psutil
  - ipywidgets
  - qiime2 {{ qiime2_epoch }}.*
  - q2templates {{ qiime2_epoch }}.*
  - q2-types {{ qiime2_epoch }}.*
test:
  requires:
  - qiime2 >={{ qiime2 }}
  - q2templates >={{ q2templates }}
  - q2-types >={{ q2_types }}
  - pytest
  imports:
  - q2_demux
  - qiime2.plugins.demux
  commands:
  - py.test --pyargs q2_demux
about:
  home: https://qiime2.org
  license: BSD-3-Clause
  license_family: BSD
